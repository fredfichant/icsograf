name: Build and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BUILD_DIR: build
      CMAKE_PREFIX_PATH: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build tools (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          set -x
          if [ "$(uname)" = "Darwin" ]; then
            brew update || true
            brew install cmake || true
            # Try qt@5, fallback to qt (may be Qt6)
            if brew info qt@5 >/dev/null 2>&1; then
              brew install qt@5 || true
              echo "CMAKE_PREFIX_PATH=/opt/homebrew/opt/qt@5" >> $GITHUB_ENV
            elif brew info qt >/dev/null 2>&1; then
              brew install qt || true
              echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV
            else
              echo "Warning: qt not found via brew. CI may fail if Qt is required."
              echo "CMAKE_PREFIX_PATH=" >> $GITHUB_ENV
            fi
          else
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential cmake \
              qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev \
              libqt5printsupport5 libqt5sql5-sqlite || {
                echo "apt-get install failed; retrying once"
                sleep 5
                sudo apt-get install -y --no-install-recommends build-essential cmake \
                  qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev \
                  libqt5printsupport5 libqt5sql5-sqlite
              }
            echo "CMAKE_PREFIX_PATH=" >> $GITHUB_ENV
          fi

      - name: Set up Qt on Windows (Chocolatey)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Vérifier que choco existe
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host 'Chocolatey non trouvé sur le runner. Utilisez un runner self-hosted avec Qt installé ou installez Qt manuellement.'
          } else {
            try {
              Write-Host 'Tentative d-installation: choco install qt5'
              choco install qt5 -y
            } catch {
              Write-Host 'Installation qt5 échouée, tentative d-installation de qt'
              try {
                choco install qt -y
              } catch {
                Write-Host 'choco install échoué; configurez Qt sur le runner ou utilisez un runner self-hosted avec Qt installé'
              }
            }
          }
          # Définir CMAKE_PREFIX_PATH pour CMake (adapter le chemin si nécessaire)
          Add-Content -Path $Env:GITHUB_ENV -Value 'CMAKE_PREFIX_PATH=C:\Qt\5.15.2\msvc2019_64'

      - name: Configure (CMake)
        run: |
          cmake -S . -B $BUILD_DIR -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"

      - name: Build
        run: |
          cmake --build $BUILD_DIR --config Release -- -j$(nproc || echo 2)
        shell: bash

      - name: Package with CPack
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cpack -G DragNDrop || cpack || true
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cpack -G ZIP || true
          else
            cpack || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            ${{ env.BUILD_DIR }}/*.dmg
            ${{ env.BUILD_DIR }}/*.zip
            ${{ env.BUILD_DIR }}/*.deb
            ${{ env.BUILD_DIR }}/*.rpm
            ${{ env.BUILD_DIR }}/*.tgz
            ${{ env.BUILD_DIR }}/*.msi
            ${{ env.BUILD_DIR }}/*.tar.gz
            ${{ env.BUILD_DIR }}/*.AppImage
            ${{ env.BUILD_DIR }}/*.pkg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts (all OS builds)
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref }}
          name: Release ${{ github.ref }}
          artifacts: "release-artifacts/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}